<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <style>
        /* Add some basic styling to make the form look nice */
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }
        form {
            max-width: 500px;
            margin: 40px auto;
            padding: 20px;
            background-color: #fff;
            border: 1px solid #ddd;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        label {
            display: block;
            margin-bottom: 10px;
        }
        select {
            width: 100%;
            height: 30px;
            margin-bottom: 20px;
            padding: 5px 10px;
            border: 1px solid #ccc;
            size: 6;
            border-radius: 5px;
        }
    
        button[type="submit"] {
            width: 100%;
            background-color: #4CAF50;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button[type="submit"]:hover {
            background-color: #3e8e41;
        }
        .predict{
            max-width: 500px;
            margin: 40px auto;
            padding: 20px;
            background-color: #fff;
            border: 1px solid #ddd;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <form action="{{url_for('predict_datapoint')}}" method="post">
        <h2>Mushroom Classification Prediction Page</h2>
        
        <label for="odor">Odor:</label>
        <select id="odor" name="odor">
            <option value="a" selected="selected">almond</option>
            <option value="l">anise</option>
            <option value="y">creosote</option>
            <option value="c">fishy</option>
            <option value="f">foul</option>
            <option value="m">musty</option>
            <option value="n">none</option>
            <option value="p">pungent</option>
            <option value="s">spicy</option>
        </select>

        <label for="gill_color">Gill Color:</label>
        <select id="gill_color" name="gill_color">
            <option value="k" selected="selected">black</option>
            <option value="n">brown</option>
            <option value="b">buff</option>
            <option value="h">chocolate</option>
            <option value="g">gray</option>
            <option value="r">green</option>
            <option value="o">orange</option>
            <option value="p">pink</option>
            <option value="u">purple</option>
            <option value="e">red</option>
            <option value="w">white</option>
            <option value="y">yellow</option>
        </select>

        <label for="spore_print_color">Spore Print Color:</label>
        <select id="spore_print_color" name="spore_print_color">
            <option value="k" selected="selected">black</option>
            <option value="n">brown</option>
            <option value="b">buff</option>
            <option value="h">chocolate</option>
            <option value="r">green</option>
            <option value="o">orange</option>
            <option value="u">purple</option>
            <option value="w">white</option>
            <option value="y">yellow</option>
        </select>

        <label for="gill_size">Gill Size:</label>
        <select id="gill_size" name="gill_size">
            <option value="n" selected="selected">narrow</option>
            <option value="b">broad</option>
        </select>

        <label for="bruises">Bruises:</label>
        <select id="bruises" name="bruises">
            <option value="t" selected="selected">bruises</option>
            <option value="f">no</option>
        </select>

        <button type="submit" name="predict">Predict</button>
    </form>
    <h2 class="predict">
        The Prediction is {{results}}
    </h2>
</body>
</html>
